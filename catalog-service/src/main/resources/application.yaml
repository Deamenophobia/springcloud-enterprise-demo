server:
  port: 8080
  shutdown: graceful
spring:
  application:
    name: catalog-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
  mvc:
    problemdetails:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 25s
security:
  jwt:
    mode: ${JWT_MODE:oidc}
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE:commerce-api}
    jwk-set-uri: ${JWT_JWK_SET_URI:}
    secret: ${JWT_SECRET:}
management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
logging:
  structured:
    format:
      console: ecs
