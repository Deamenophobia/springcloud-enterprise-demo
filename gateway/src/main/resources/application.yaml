server:
  port: 8080
  shutdown: graceful
spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 1000
            response-timeout: 8s
          default-filters:
            - name: RequestSize
              args:
                maxSize: 64KB
          routes:
            - id: catalog
              uri: ${CATALOG_URL:http://catalog-service:8080}
              predicates:
                - Path=/api/products,/api/products/**
            - id: orders
              uri: ${ORDER_URL:http://order-service:8080}
              predicates:
                - Path=/api/orders,/api/orders/**
  lifecycle:
    timeout-per-shutdown-phase: 25s
security:
  jwt:
    mode: ${JWT_MODE:oidc}
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE:commerce-api}
    jwk-set-uri: ${JWT_JWK_SET_URI:}
    secret: ${JWT_SECRET:}
management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
logging:
  structured:
    format:
      console: ecs
