server:
  port: 8080
  shutdown: graceful
spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
  mvc:
    problemdetails:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 25s
security:
  jwt:
    mode: ${JWT_MODE:oidc}
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE:commerce-api}
    jwk-set-uri: ${JWT_JWK_SET_URI:}
    secret: ${JWT_SECRET:}
management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
logging:
  structured:
    format:
      console: ecs
catalog:
  url: ${CATALOG_URL:http://catalog-service:8080}
spring.cloud.circuitbreaker.resilience4j:
  disable-time-limiter: true
  disable-thread-pool: true
resilience4j:
  circuitbreaker:
    instances:
      catalog:
        slidingWindowSize: 20
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException
